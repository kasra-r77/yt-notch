<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fake player</title>
<!--
  A stand-in for music.youtube.com with the same pieces the bridge reads: Media Session
  metadata and action handlers, a video element, the page config, the like button, the
  sign-in markers, the sidebar's playlist entries, the queue, and the shuffle and repeat
  controls. Their structure follows the site as measured in the spikes (S0.3, S0.4).
  Playback is simulated, so tests are deterministic and need no network or audio.
  Options come from the address's hash, comma-separated:
    signed-out      the user is not signed in
    no-handlers     the page registers no Media Session action handlers
    no-like         there is no like button
    empty           nothing is loaded: no track and no video element
    no-sidebar      the sidebar has no playlist entries
    no-queue        there is no queue
    no-shuffle      there is no shuffle button
    no-repeat       there is no repeat button
    other-language  the repeat button's labels are not in English
  `window.fixture` lets tests drive the page: advance time, switch tracks, sign out, and so on.
-->
<script>
  const options = new Set(location.hash.slice(1).split(',').filter(Boolean));
  window.fixture = { loggedIn: !options.has('signed-out'), errors: [] };
  window.addEventListener('error', (event) => window.fixture.errors.push(String(event.message)));
  window.addEventListener('unhandledrejection', (event) => window.fixture.errors.push('unhandled rejection: ' + String(event.reason)));
  // Like the site, the page config is set early in <head>.
  window.ytcfg = { get: (key) => (key === 'LOGGED_IN' ? window.fixture.loggedIn : undefined) };
</script>
</head>
<body>
<header id="top-bar"></header>
<main id="player"></main>
<nav id="guide"></nav>
<footer id="actions">
  <like-button-view-model><button aria-pressed="false" aria-label="Like">Like</button></like-button-view-model>
  <div class="ytmusicPlayerControlsShuffleButton"><button aria-pressed="false" aria-label="Shuffle" title="Shuffle">Shuffle</button></div>
  <div class="ytmusicPlayerControlsRepeatButton"><button aria-pressed="false" aria-label="Repeat off" title="Repeat off">Repeat</button></div>
</footer>
<ytmusic-player-queue>
  <div id="contents"></div>
  <div id="automix-contents"></div>
</ytmusic-player-queue>
<script>
(() => {
  const TRACKS = [
    { id: 'a', title: 'First Song', artist: 'The Fixtures', album: 'Test Album', duration: 200 },
    { id: 'b', title: 'Second Song', artist: 'The Fixtures', album: 'Test Album', duration: 150 },
    { id: 'c', title: 'Third Song', artist: 'Someone Else', album: null, duration: 90 },
  ];
  const artwork = (id) => [60, 120, 226, 544].map((size) => ({
    src: 'https://fixture.ytnotch.test/art/' + id + '-' + size + '.jpg',
    sizes: size + 'x' + size,
    type: 'image/jpeg',
  }));

  const topBar = document.getElementById('top-bar');
  if (window.fixture.loggedIn) {
    topBar.appendChild(document.createElement('ytmusic-settings-button'));
  } else {
    const link = document.createElement('a');
    link.href = 'https://accounts.google.com/ServiceLogin?service=youtube';
    link.textContent = 'Sign in';
    topBar.appendChild(link);
  }

  // A video element whose playback is simulated: time moves only when a test advances it.
  const video = document.createElement('video');
  const liked = new Set();
  let index = 0;
  let time = 0;
  let paused = true;
  let ended = false;
  const fire = (name) => video.dispatchEvent(new Event(name));
  const current = () => TRACKS[index];

  Object.defineProperties(video, {
    paused: { configurable: true, get: () => paused },
    ended: { configurable: true, get: () => ended },
    duration: { configurable: true, get: () => current().duration },
    currentTime: {
      configurable: true,
      get: () => time,
      set: (value) => {
        time = Math.max(0, Math.min(Number(value) || 0, current().duration));
        ended = false;
        fire('seeked');
      },
    },
  });
  video.play = () => {
    paused = false;
    ended = false;
    showQueue();
    fire('play');
    fire('playing');
    return Promise.resolve();
  };
  video.pause = () => {
    if (paused) return;
    paused = true;
    showQueue();
    fire('pause');
  };

  const likeButton = document.querySelector('like-button-view-model button');
  const showLike = () => likeButton.setAttribute('aria-pressed', String(liked.has(current().id)));
  likeButton.addEventListener('click', () => {
    if (liked.has(current().id)) liked.delete(current().id);
    else liked.add(current().id);
    showLike();
  });

  // The sidebar: navigation entries, then playlists, as the site lists them. Each entry
  // carries its data as a property, like the site's elements.
  const GUIDE = [
    ['FEmusic_home', 'Home'], ['FEmusic_explore', 'Explore'], ['FEmusic_library_landing', 'Library'],
    ['VLLM', 'Liked music'], ['VLPLfixture-mix', 'Fixture Mix'], ['VLPLfixture-focus', 'Focus'],
    ['VLPLfixture-mix', 'Fixture Mix'], ['VLSE', 'Episodes for later'],
  ];
  if (!options.has('no-sidebar')) {
    const guide = document.getElementById('guide');
    for (const [browseId, title] of GUIDE) {
      const entry = document.createElement('ytmusic-guide-entry-renderer');
      entry.data = { navigationEndpoint: { browseEndpoint: { browseId } }, formattedTitle: { runs: [{ text: title }] } };
      const titleElement = document.createElement('yt-formatted-string');
      titleElement.className = 'title';
      titleElement.textContent = title;
      entry.appendChild(titleElement);
      guide.appendChild(entry);
    }
  }

  // The queue: one item per track. The second comes as a song/video pair, and one Autoplay
  // suggestion follows; the bridge must leave out the counterpart and the suggestion.
  const queueItems = [];
  function queueItem(track, trackIndex) {
    const item = document.createElement('ytmusic-player-queue-item');
    item.setAttribute('play-button-state', 'default');
    const title = document.createElement('yt-formatted-string');
    title.className = 'song-title';
    title.textContent = track.title;
    const byline = document.createElement('yt-formatted-string');
    byline.className = 'byline';
    byline.textContent = track.artist;
    const playButton = document.createElement('ytmusic-play-button-renderer');
    playButton.addEventListener('click', () => load(trackIndex, true));
    item.append(playButton, title, byline);
    return item;
  }
  if (!options.has('no-queue') && !options.has('empty')) {
    const contents = document.getElementById('contents');
    TRACKS.forEach((track, trackIndex) => {
      const item = queueItem(track, trackIndex);
      queueItems.push(item);
      if (trackIndex === 1) {
        const pair = document.createElement('ytmusic-playlist-panel-video-wrapper-renderer');
        const primary = document.createElement('div');
        primary.id = 'primary-renderer';
        primary.appendChild(item);
        const counterpart = document.createElement('div');
        counterpart.id = 'counterpart-renderer';
        counterpart.appendChild(queueItem({ title: track.title + ' (video)', artist: track.artist }, trackIndex));
        pair.append(primary, counterpart);
        contents.appendChild(pair);
      } else {
        contents.appendChild(item);
      }
    });
    document.getElementById('automix-contents').appendChild(queueItem({ title: 'Autoplay Suggestion', artist: 'Someone' }, 0));
  }
  function showQueue() {
    queueItems.forEach((item, itemIndex) => {
      const isCurrent = itemIndex === index;
      item.setAttribute('play-button-state', isCurrent ? (paused ? 'paused' : 'playing') : 'default');
      if (isCurrent) item.setAttribute('selected', ''); else item.removeAttribute('selected');
    });
  }

  // Shuffle toggles; repeat cycles off, all, one, with its state in aria-pressed and label.
  const shuffleButton = document.querySelector('.ytmusicPlayerControlsShuffleButton button');
  shuffleButton.addEventListener('click', () => {
    shuffleButton.setAttribute('aria-pressed', String(shuffleButton.getAttribute('aria-pressed') !== 'true'));
  });
  const REPEAT_LABELS = options.has('other-language')
    ? { off: 'Ismétlés kikapcsolva', all: 'Összes ismétlése', one: 'Egy ismétlése' }
    : { off: 'Repeat off', all: 'Repeat all', one: 'Repeat one' };
  const repeatButton = document.querySelector('.ytmusicPlayerControlsRepeatButton button');
  let repeatMode = 'off';
  function showRepeat() {
    repeatButton.setAttribute('aria-pressed', String(repeatMode !== 'off'));
    repeatButton.setAttribute('aria-label', REPEAT_LABELS[repeatMode]);
    repeatButton.setAttribute('title', REPEAT_LABELS[repeatMode]);
  }
  repeatButton.addEventListener('click', () => {
    repeatMode = { off: 'all', all: 'one', one: 'off' }[repeatMode];
    showRepeat();
  });
  showRepeat();
  if (options.has('no-shuffle') || options.has('empty')) shuffleButton.parentElement.remove();
  if (options.has('no-repeat') || options.has('empty')) repeatButton.parentElement.remove();

  function load(next, autoplay) {
    index = (next + TRACKS.length) % TRACKS.length;
    time = 0;
    ended = false;
    const track = current();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: track.artist,
      album: track.album || '',
      artwork: artwork(track.id),
    });
    fire('durationchange');
    fire('loadedmetadata');
    showLike();
    showQueue();
    if (autoplay) video.play();
  }

  if (options.has('empty')) {
    likeButton.parentElement.remove();
  } else {
    document.getElementById('player').appendChild(video);
    if (!options.has('no-handlers')) {
      navigator.mediaSession.setActionHandler('play', () => video.play());
      navigator.mediaSession.setActionHandler('pause', () => video.pause());
      navigator.mediaSession.setActionHandler('nexttrack', () => load(index + 1, true));
      // Like the site: after 3 seconds, previous restarts the track.
      navigator.mediaSession.setActionHandler('previoustrack', () => {
        if (time > 3) video.currentTime = 0;
        else load(index - 1, true);
      });
      navigator.mediaSession.setActionHandler('seekto', (details) => { video.currentTime = details.seekTime; });
    }
    load(0, false);
  }
  if (options.has('no-like') && likeButton.isConnected) likeButton.parentElement.remove();

  Object.assign(window.fixture, {
    /// Moves playback time on. At the end of a track the page goes to the next one.
    advance(seconds) {
      if (paused || !video.isConnected) return;
      time += seconds;
      if (time >= current().duration) {
        time = current().duration;
        ended = true;
        fire('ended');
        load(index + 1, true);
      }
    },
    setTrack(next) { load(next, !paused); },
    signOut() {
      window.fixture.loggedIn = false;
      topBar.replaceChildren();
      const link = document.createElement('a');
      link.href = 'https://accounts.google.com/ServiceLogin?service=youtube';
      link.textContent = 'Sign in';
      topBar.appendChild(link);
    },
    removeVideo() { fire('emptied'); video.remove(); },
    removeLikeButton() { if (likeButton.isConnected) likeButton.parentElement.remove(); },
    unregister(action) { navigator.mediaSession.setActionHandler(action, null); },
    removeShuffle() { shuffleButton.parentElement.remove(); },
    status() {
      return {
        index, time, paused, liked: liked.has(current().id), title: current().title,
        shuffle: shuffleButton.getAttribute('aria-pressed') === 'true', repeat: repeatMode,
      };
    },
  });
})();
</script>
</body>
</html>
