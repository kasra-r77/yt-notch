name: Release

# Pull requests that change the release build the image too, without releasing it, so a
# broken release is caught before a tag. The app reads appcast.xml from the latest release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - scripts/make-dmg.sh
      - scripts/make-appcast.sh
      - .github/workflows/release.yml
      - docs/design/brand/dmg-background*.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build the disk image
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen and create-dmg
        run: brew install xcodegen create-dmg

      - name: Build the disk image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export EXPECTED_VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "dmg=$(scripts/make-dmg.sh | tail -n 1)" >> "$GITHUB_ENV"

      - name: Keep the image with the run
        uses: actions/upload-artifact@v4
        with:
          name: disk-image
          path: ${{ env.dmg }}
          if-no-files-found: error

      - name: Look for the update key
        id: update-key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: echo "present=$([[ -n "$SPARKLE_PRIVATE_KEY" ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Make the update feed
        if: startsWith(github.ref, 'refs/tags/v') && steps.update-key.outputs.present == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/make-appcast.sh "$dmg" "$GITHUB_REF_NAME"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The README's Download button points at releases/latest/download/YT-Notch.dmg,
          # which needs the same file name in every release.
          cp "$dmg" dist/YT-Notch.dmg
          files=("$dmg" dist/YT-Notch.dmg)
          if [[ -f dist/appcast.xml ]]; then files+=(dist/appcast.xml); fi
          # A release made on GitHub's website already exists by the time this runs.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "YT Notch ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
